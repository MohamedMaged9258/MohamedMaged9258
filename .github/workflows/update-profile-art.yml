name: Update profile art

# Re-scrapes the public contribution calendar and re-renders the heatmap SVG
# every day. No token, no auth -- fetch_contributions.py reads the same public
# HTML GitHub already serves. The only permission needed is contents:write so
# the job can commit the refreshed SVG back (Settings -> Actions -> General ->
# Workflow permissions -> Read and write).

on:
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: MohamedMaged9258
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Scrape contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          if git diff --staged --quiet; then
            echo "No contribution changes today."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
